# ──────────────────────────────────────────────────────────────────────────
# WyberAi — Downloadable Native Build
#
# Scaffolds a generated project into a real Expo app and produces a real,
# directly-downloadable APK (installable on any Android device without an
# app store). Distinct from build-preview.yml, which streams a build into
# Appetize.io for in-browser device preview instead of handing back a file.
#
# Required repository secrets (Settings → Secrets → Actions):
#   EXPO_TOKEN                  — expo.dev access token (Account Settings → Access Tokens)
#   MOBILE_BUILD_WEBHOOK_SECRET — same value as MOBILE_BUILD_WEBHOOK_SECRET on the WyberAi server
#
# The exact dependency versions below come from Expo SDK 54's own
# bundledNativeModules.json (github.com/expo/expo/blob/sdk-54/packages/expo/
# bundledNativeModules.json) — an earlier version of this file pinned
# react-native 0.76.9 against expo ~54.0.0, which no longer matches (SDK 54
# actually bundles react-native 0.81.5) and fails with "Could not set unknown
# property 'enableBundleCompression'..." at build time. Re-check that file
# and update these versions together whenever the SDK version below changes.
# ──────────────────────────────────────────────────────────────────────────
name: Build Downloadable Artifact

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: WyberAi mobile_builds row id
        required: true
        type: string
      project_id:
        description: WyberAi project ID
        required: true
        type: string
      platform:
        description: android or ios
        required: true
        type: string
        default: android
      files_url:
        description: URL to fetch project files JSON
        required: true
        type: string
      callback_url:
        description: WyberAi webhook URL for build result
        required: true
        type: string

jobs:
  build-android:
    if: github.event.inputs.platform == 'android'
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Notify WyberAi — build started
        run: |
          curl -sf -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "x-mobile-build-secret: ${{ secrets.MOBILE_BUILD_WEBHOOK_SECRET }}" \
            -d "{\"buildId\":\"${{ github.event.inputs.build_id }}\",\"status\":\"building\"}" || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Fetch project files from WyberAi
        run: |
          curl -sf "${{ github.event.inputs.files_url }}" -o project_data.json
          echo "Fetched $(cat project_data.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d.get("files",{})))') files"

      - name: Scaffold Expo project
        run: |
          mkdir -p wyber_app
          cd wyber_app

          python3 << 'PYEOF'
          import json, pathlib

          with open('../project_data.json') as f:
              data = json.load(f)

          files = data.get('files', {})

          for path, value in files.items():
              content = value.get('content', '') if isinstance(value, dict) else (value or '')
              if path.startswith('src/'):
                  path = path[4:]
              full_path = pathlib.Path(path)
              full_path.parent.mkdir(parents=True, exist_ok=True)
              full_path.write_text(content)
              print(f'  wrote {path}')
          PYEOF

          cat > package.json << 'JSON'
          {
            "name": "wyberai-app",
            "version": "1.0.0",
            "main": "App.tsx",
            "scripts": { "start": "expo start" },
            "dependencies": {
              "expo": "~54.0.0",
              "expo-build-properties": "~1.0.10",
              "expo-status-bar": "~3.0.9",
              "expo-constants": "~18.0.14",
              "expo-linear-gradient": "~15.0.8",
              "expo-blur": "~15.0.8",
              "expo-haptics": "~15.0.8",
              "@expo/vector-icons": "^15.0.3",
              "@react-navigation/native": "^7.0.0",
              "@react-navigation/native-stack": "^7.0.0",
              "@react-navigation/bottom-tabs": "^7.0.0",
              "@react-navigation/stack": "^7.0.0",
              "@react-navigation/drawer": "^7.0.0",
              "react-native-screens": "~4.16.0",
              "react-native-safe-area-context": "~5.6.0",
              "react-native-gesture-handler": "~2.28.0",
              "react-native-reanimated": "~4.1.1",
              "react-native-worklets": "~0.5.1",
              "react-native-svg": "15.12.1",
              "@react-native-async-storage/async-storage": "2.2.0",
              "react": "19.1.0",
              "react-native": "0.81.5"
            },
            "devDependencies": {
              "@babel/core": "^7.26.0",
              "typescript": "~5.8.3"
            }
          }
          JSON

          # kotlinVersion pin: Expo SDK 54's default Kotlin (1.9.25) has no
          # matching KSP release on EAS's current build image — every build
          # fails with "Can't find KSP version for Kotlin version '1.9.25'"
          # without it (confirmed by an actual failed build during setup).
          PROJECT_ID="${{ github.event.inputs.project_id }}"
          BUNDLE_SUFFIX=$(echo "$PROJECT_ID" | tr -dc 'a-z0-9' | head -c 16)
          cat > app.json << JSON_EOF
          {
            "expo": {
              "name": "WyberAi App",
              "slug": "wyberai-app-${BUNDLE_SUFFIX}",
              "version": "1.0.0",
              "orientation": "portrait",
              "android": {
                "package": "com.wyberai.app.${BUNDLE_SUFFIX}",
                "adaptiveIcon": { "backgroundColor": "#09090b" }
              },
              "sdkVersion": "54.0.0",
              "plugins": [
                ["expo-build-properties", { "android": { "kotlinVersion": "2.0.21" } }]
              ]
            }
          }
          JSON_EOF

          cat > eas.json << 'EAS_EOF'
          {
            "build": {
              "apk_download": {
                "distribution": "internal",
                "android": { "buildType": "apk" }
              }
            }
          }
          EAS_EOF

      - name: Install npm dependencies
        working-directory: wyber_app
        run: npm install --legacy-peer-deps

      # A robot access token can't run the normal interactive `eas build`
      # first-time project setup, and every generated app is a brand new EAS
      # project (unique slug per build) — so this has to run non-interactively
      # every time, not just once. Confirmed locally: without this, `eas
      # build` fails with "EAS project not configured". Runs BEFORE git init
      # below because it rewrites app.json (adds extra.eas.projectId) — that
      # needs to be part of what gets committed and archived.
      - name: eas init (register this as a new EAS project)
        working-directory: wyber_app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --account signalpulse-technologies --non-interactive --force

      # EAS archives the project with `git ls-files` when a git repo is
      # present. Without one it falls back to a much broader/slower directory
      # scan that can fail entirely in some environments (confirmed locally:
      # it errored trying to scandir an unrelated OS folder). This directory
      # is freshly scaffolded by this workflow, so there's no repo yet. The
      # .gitignore matters — without it `git add -A` stages node_modules too,
      # turning a ~200KB archive into a multi-hundred-MB one (confirmed locally).
      # package-lock.json is deliberately excluded too: EAS runs the stricter
      # `npm ci` instead of `npm install` whenever a lockfile is present, and
      # ours (generated once, on this runner, for a throwaway per-build
      # scaffold) drifts from what a fresh install actually resolves — e.g.
      # react-native-reanimated pulling a react-native-worklets version EAS's
      # own bundled pin didn't have, which `npm ci` treats as fatal. Skipping
      # the lockfile lets EAS re-resolve freely (see EAS_BUILD_SKIP_LOCKFILE_CHECK
      # below) — confirmed locally to fix an otherwise-reproducible failure.
      - name: git init (so EAS archives via git ls-files)
        working-directory: wyber_app
        run: |
          printf 'node_modules/\n.expo/\nandroid/\nios/\npackage-lock.json\n' > .gitignore
          git init -q
          git add -A
          git -c user.email="ci@wyberai.com" -c user.name="WyberAi CI" commit -q -m "build ${{ github.event.inputs.build_id }}"

      - name: Build Android APK via EAS
        working-directory: wyber_app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_SKIP_LOCKFILE_CHECK: '1'
        run: |
          eas build --platform android --profile apk_download --non-interactive --no-wait \
            --json > ../build_start.json 2>&1 || true
          cat ../build_start.json
          BUILD_ID=$(cat ../build_start.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[0]["id"])' 2>/dev/null || echo "")
          echo "EAS_BUILD_ID=$BUILD_ID" >> $GITHUB_ENV

      - name: Wait for EAS build to complete
        working-directory: wyber_app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EAS_BUILD_ID" ]; then
            echo "BUILD_FAILED=1" >> $GITHUB_ENV
            exit 0
          fi
          echo "Polling EAS build $EAS_BUILD_ID"
          for i in $(seq 1 50); do
            sleep 30
            STATUS=$(eas build:view "$EAS_BUILD_ID" --json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status",""))' 2>/dev/null || echo "")
            echo "  attempt $i — status: $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then
              APK_URL=$(eas build:view "$EAS_BUILD_ID" --json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("artifacts",{}).get("buildUrl",""))' 2>/dev/null || echo "")
              echo "ARTIFACT_URL=$APK_URL" >> $GITHUB_ENV
              echo "BUILD_OK=1" >> $GITHUB_ENV
              break
            fi
            if [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "BUILD_FAILED=1" >> $GITHUB_ENV
              break
            fi
          done

      - name: Notify WyberAi — success
        if: env.BUILD_OK == '1' && env.ARTIFACT_URL != ''
        run: |
          curl -sf -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "x-mobile-build-secret: ${{ secrets.MOBILE_BUILD_WEBHOOK_SECRET }}" \
            -d "{\"buildId\":\"${{ github.event.inputs.build_id }}\",\"status\":\"ready\",\"buildUrl\":\"$ARTIFACT_URL\"}"

      - name: Notify WyberAi — failure
        if: env.BUILD_OK != '1' || env.ARTIFACT_URL == ''
        run: |
          curl -sf -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "x-mobile-build-secret: ${{ secrets.MOBILE_BUILD_WEBHOOK_SECRET }}" \
            -d "{\"buildId\":\"${{ github.event.inputs.build_id }}\",\"status\":\"error\",\"errorMessage\":\"Build failed — check GitHub Actions logs\"}" || true
