<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');
:root{--bg:#05080d;--card:#0d141e;--card2:#111b28;--ink:#e8eef7;--ink2:#9aa8bb;--ink3:#8797ab;--line:rgba(150,190,235,.18);--brand:#0ea5e9;--hot:#38bdf8;--btn:#03111c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'General Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:relative;overflow:hidden;background:radial-gradient(1100px 700px at 85% -10%,rgba(14,165,233,.22),transparent 60%),radial-gradient(800px 600px at -10% 110%,rgba(14,165,233,.10),transparent 60%),var(--bg)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:30px;letter-spacing:-.01em}
.brand svg{width:44px;height:44px}
h1,h2{font-weight:700;letter-spacing:-.03em;line-height:1.02;text-wrap:balance}
.hot{color:var(--hot)}
.pill{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:10px 22px;font-size:26px;color:var(--ink2);background:rgba(13,20,30,.7)}
.cta{display:inline-flex;align-items:center;gap:12px;background:var(--brand);color:var(--btn);font-weight:700;border-radius:18px}
body{width:1080px;height:1350px}.stage{width:1080px;height:1350px}</style></head><body><div class="stage">
<div style="position:absolute;inset:80px">
  <div style="display:flex;justify-content:space-between;align-items:center"><div class="brand"><svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="14" fill="#0EA5E9"/><path d="M40 14L22 32L40 50" stroke="#03111c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 22L56 32L46 42" stroke="#03111c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity=".4"/></svg><span>WyberAi</span></div><div class="mono" style="font-size:22px">WyberCode 1.0</div></div>
  <h2 style="font-size:116px;margin-top:70px">Top-ups got<br><span class="hot">bigger too.</span></h2>
  <div style="margin-top:70px;display:flex;flex-direction:column;gap:26px">
  
    <div style="display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:38px 46px">
      <div><div style="font-size:44px;font-weight:700">Boost</div><div class="mono" style="font-size:22px;margin-top:6px">$19 one-time · never expires</div></div>
      <div style="text-align:right"><div style="font-size:84px;font-weight:700;color:var(--hot);line-height:1">120</div><div style="font-size:26px;color:var(--ink3);margin-top:6px">credits <span style="text-decoration:line-through">(40)</span></div></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:38px 46px">
      <div><div style="font-size:44px;font-weight:700">Power</div><div class="mono" style="font-size:22px;margin-top:6px">$49 one-time · never expires</div></div>
      <div style="text-align:right"><div style="font-size:84px;font-weight:700;color:var(--hot);line-height:1">300</div><div style="font-size:26px;color:var(--ink3);margin-top:6px">credits <span style="text-decoration:line-through">(100)</span></div></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:38px 46px">
      <div><div style="font-size:44px;font-weight:700">Studio</div><div class="mono" style="font-size:22px;margin-top:6px">$99 one-time · never expires</div></div>
      <div style="text-align:right"><div style="font-size:84px;font-weight:700;color:var(--hot);line-height:1">600</div><div style="font-size:26px;color:var(--ink3);margin-top:6px">credits <span style="text-decoration:line-through">(200)</span></div></div>
    </div>
  </div>
  <div style="position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end"><div class="mono" style="font-size:20px">Same prices as before</div><div class="mono" style="font-size:22px">wyberai.com</div></div>
</div></div></body></html>
