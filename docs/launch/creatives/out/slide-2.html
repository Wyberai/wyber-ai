<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');
:root{--bg:#05080d;--card:#0d141e;--ink:#e8eef7;--ink2:#9aa8bb;--ink3:#8797ab;--line:rgba(150,190,235,.18);--brand:#0ea5e9;--hot:#38bdf8;--btn:#03111c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:var(--bg);color:var(--ink);font-family:'General Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:relative;width:1080px;height:1350px;overflow:hidden;background:radial-gradient(1100px 700px at 85% -10%,rgba(14,165,233,.24),transparent 60%),radial-gradient(800px 600px at -10% 110%,rgba(14,165,233,.10),transparent 60%),var(--bg)}
.in{position:absolute;inset:80px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.logo{display:flex;align-items:center;gap:14px}
.logo svg{width:52px;height:52px}
.logo b{font-weight:800;font-size:38px;letter-spacing:-.03em;line-height:1}
.logo b i{font-style:normal;color:var(--brand)}
h1,h2{font-weight:700;letter-spacing:-.03em;line-height:1.02;text-wrap:balance}
.hot{color:var(--hot)}
.top{display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:10px}.dots span{width:44px;height:6px;border-radius:3px;background:var(--line)}.dots span.on{background:var(--brand)}
.swipe{position:absolute;bottom:0;right:0;font-size:22px}
.cta{display:inline-flex;background:var(--brand);color:var(--btn);font-weight:700;border-radius:18px;font-size:40px;padding:30px 54px}
</style></head><body><div class="stage"><div class="in">
<div class="top"><div class="logo"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#0EA5E9"/><path d="M20 7L11 16L20 25" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 11L28 16L23 21" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/></svg><b>Wyber<i>Ai</i></b></div><div class="dots"><span class=""></span><span class="on"></span><span class=""></span></div></div>
<h2 style="font-size:112px;margin-top:80px">3× the credits.<br><span class="hot">Same price.</span></h2>
<div style="margin-top:60px;display:flex;flex-direction:column;gap:20px">

  <div style="display:grid;grid-template-columns:1fr auto;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:30px 40px">
    <div><div style="font-size:42px;font-weight:700">Spark</div><div class="mono" style="font-size:20px;margin-top:6px">₹499 / month · unchanged</div></div>
    <div style="display:flex;align-items:baseline;gap:22px"><span style="font-size:34px;color:var(--ink3);text-decoration:line-through">50</span><span style="font-size:76px;font-weight:700;color:var(--hot);line-height:1">150</span></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr auto;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:30px 40px">
    <div><div style="font-size:42px;font-weight:700">Starter</div><div class="mono" style="font-size:20px;margin-top:6px">$29 / month · unchanged</div></div>
    <div style="display:flex;align-items:baseline;gap:22px"><span style="font-size:34px;color:var(--ink3);text-decoration:line-through">150</span><span style="font-size:76px;font-weight:700;color:var(--hot);line-height:1">450</span></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr auto;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:30px 40px">
    <div><div style="font-size:42px;font-weight:700">Builder</div><div class="mono" style="font-size:20px;margin-top:6px">$79 / month · unchanged</div></div>
    <div style="display:flex;align-items:baseline;gap:22px"><span style="font-size:34px;color:var(--ink3);text-decoration:line-through">500</span><span style="font-size:76px;font-weight:700;color:var(--hot);line-height:1">1,500</span></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr auto;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:30px 40px">
    <div><div style="font-size:42px;font-weight:700">Pro</div><div class="mono" style="font-size:20px;margin-top:6px">$199 / month · unchanged</div></div>
    <div style="display:flex;align-items:baseline;gap:22px"><span style="font-size:34px;color:var(--ink3);text-decoration:line-through">1,500</span><span style="font-size:76px;font-weight:700;color:var(--hot);line-height:1">4,500</span></div>
  </div>
</div>
<div class="mono" style="position:absolute;bottom:0;left:0;font-size:20px">Credits per month · free plan stays at 30</div></div></div></body></html>
