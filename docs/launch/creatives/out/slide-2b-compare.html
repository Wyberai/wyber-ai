<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');
:root{--bg:#05080d;--card:#0d141e;--ink:#e8eef7;--ink2:#9aa8bb;--ink3:#8797ab;--line:rgba(150,190,235,.18);--brand:#0ea5e9;--hot:#38bdf8;--btn:#03111c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:var(--bg);color:var(--ink);font-family:'General Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:relative;width:1080px;height:1350px;overflow:hidden;background:radial-gradient(1100px 700px at 85% -10%,rgba(14,165,233,.24),transparent 60%),radial-gradient(800px 600px at -10% 110%,rgba(14,165,233,.10),transparent 60%),var(--bg)}
.in{position:absolute;inset:80px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.logo{display:flex;align-items:center;gap:14px}
.logo svg{width:52px;height:52px}
.logo b{font-weight:800;font-size:38px;letter-spacing:-.03em;line-height:1}
.logo b i{font-style:normal;color:var(--brand)}
h1,h2{font-weight:700;letter-spacing:-.03em;line-height:1.02;text-wrap:balance}
.hot{color:var(--hot)}
.top{display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:10px}.dots span{width:44px;height:6px;border-radius:3px;background:var(--line)}.dots span.on{background:var(--brand)}
.swipe{position:absolute;bottom:0;right:0;font-size:22px}
.cta{display:inline-flex;background:var(--brand);color:var(--btn);font-weight:700;border-radius:18px;font-size:40px;padding:30px 54px}
</style></head><body><div class="stage"><div class="in">
<div class="top"><div class="logo"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#0EA5E9"/><path d="M20 7L11 16L20 25" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 11L28 16L23 21" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/></svg><b>Wyber<i>Ai</i></b></div><div class="mono" style="font-size:20px">Optional slide</div></div>
<h2 style="font-size:112px;margin-top:80px">Same price range.<br><span class="hot">4.5× the credits.</span></h2>
<div style="margin-top:64px;display:flex;flex-direction:column;gap:22px">
  <div style="background:linear-gradient(135deg,rgba(14,165,233,.22),rgba(14,165,233,.06));border:2px solid var(--brand);border-radius:28px;padding:44px 48px;display:flex;justify-content:space-between;align-items:center">
    <div><div style="font-size:46px;font-weight:700">WyberAi Starter</div><div class="mono" style="font-size:22px;margin-top:8px">$29 / month</div></div>
    <div style="text-align:right"><div style="font-size:112px;font-weight:700;color:var(--hot);line-height:1">450</div><div class="mono" style="font-size:20px">credits / month</div></div>
  </div>
  <div style="background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:44px 48px;display:flex;justify-content:space-between;align-items:center">
    <div><div style="font-size:46px;font-weight:700;color:var(--ink2)">Lovable Pro</div><div class="mono" style="font-size:22px;margin-top:8px">$25 / month</div></div>
    <div style="text-align:right"><div style="font-size:112px;font-weight:700;color:var(--ink3);line-height:1">100</div><div class="mono" style="font-size:20px">credits / month</div></div>
  </div>
</div>
<div style="position:absolute;bottom:0;left:0;right:0;font-size:20px;color:var(--ink3);line-height:1.45">Lovable Pro per its public plans page, Nov 2026. Credit sizes differ between products, so compare real builds too. Try both free.</div></div></div></body></html>
