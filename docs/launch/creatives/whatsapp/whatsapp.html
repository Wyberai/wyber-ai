<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');
:root{--bg:#05080d;--ink:#e8eef7;--ink2:#9aa8bb;--ink3:#8797ab;--line:rgba(150,190,235,.22);--brand:#0ea5e9;--hot:#38bdf8;--btn:#03111c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:var(--bg);color:var(--ink);font-family:'General Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:relative;width:1080px;height:1080px;overflow:hidden;background:radial-gradient(1000px 700px at 90% -10%,rgba(14,165,233,.28),transparent 60%),radial-gradient(800px 600px at -10% 110%,rgba(14,165,233,.12),transparent 60%),var(--bg)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.logo{display:flex;align-items:center;gap:14px}.logo svg{width:52px;height:52px}.logo b{font-weight:800;font-size:38px;letter-spacing:-.03em;line-height:1}.logo b i{font-style:normal;color:var(--brand)}
h1{font-weight:700;letter-spacing:-.03em;line-height:1.02}.hot{color:var(--hot)}
.pill{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:10px 24px;font-size:28px;color:var(--ink2);background:rgba(13,20,30,.7)}
.cta{display:inline-flex;background:var(--brand);color:var(--btn);font-weight:700;border-radius:18px;font-size:36px;padding:26px 48px}
</style></head><body><div class="stage">
<div style="position:absolute;inset:70px">
  <div class="logo"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#0EA5E9"/><path d="M20 7L11 16L20 25" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 11L28 16L23 21" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/></svg><b>Wyber<i>Ai</i></b></div>
  <div class="mono" style="font-size:24px;margin-top:84px">Now live</div>
  <h1 style="font-size:150px;margin-top:18px;white-space:nowrap">WyberCode<br><span class="hot">1.0</span></h1>
  <div style="font-size:44px;color:var(--ink2);margin-top:30px;line-height:1.25">3× the credits on every paid plan.<br>Same price.</div>
  <div style="position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end">
    <div class="cta">Try it free · wyberai.com</div>
  </div>
</div></div></body></html>
