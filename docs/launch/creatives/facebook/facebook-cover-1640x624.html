<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');
:root{--bg:#05080d;--ink:#e8eef7;--ink2:#9aa8bb;--ink3:#8797ab;--line:rgba(150,190,235,.22);--brand:#0ea5e9;--hot:#38bdf8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1640px;height:624px;background:var(--bg);color:var(--ink);font-family:'General Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:relative;width:1640px;height:624px;overflow:hidden;background:radial-gradient(984px 811.2px at 88% -15%,rgba(14,165,233,.30),transparent 60%),radial-gradient(656px 624px at 0% 120%,rgba(14,165,233,.12),transparent 60%),var(--bg)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.logo{display:flex;align-items:center;gap:14px}.logo svg{width:var(--m);height:var(--m)}.logo b{font-weight:800;font-size:var(--w);letter-spacing:-.03em;line-height:1}.logo b i{font-style:normal;color:var(--brand)}
h1{font-weight:700;letter-spacing:-.03em;line-height:1.04}.hot{color:var(--hot)}
.pill{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;color:var(--ink2);background:rgba(13,20,30,.7)}
</style></head><body><div class="stage">
    <div style="position:absolute;left:0;right:0;top:150px;text-align:center">
      <div style="display:flex;justify-content:center"><div class="logo" style="--m:56px;--w:44px"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#0EA5E9"/><path d="M20 7L11 16L20 25" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 11L28 16L23 21" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/></svg><b>Wyber<i>Ai</i></b></div></div>
      <h1 style="font-size:108px;margin-top:26px;white-space:nowrap">WyberCode 1.0 <span class="hot">is live.</span></h1>
      <div style="font-size:42px;color:var(--ink2);margin-top:20px">3× the credits on every paid plan. Same price.</div>
      <div style="margin-top:26px"><span class="pill" style="font-size:28px;padding:10px 28px">Describe it. Watch it. Own it.</span></div>
    </div></div></body></html>
